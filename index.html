<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Game Companion</title>
<style>
  /* ---- Responsive scale tokens ---- */
  :root {
    /* Grid cell: 28px on small phones → 44px on tablets */
    --cell:      clamp(28px, 7.5vw, 44px);
    /* Name column: matches cell row width */
    --name-w:    clamp(72px, 19vw, 110px);
    /* X / ✓ glyph inside cell */
    --cell-font: clamp(16px, 4.5vw, 28px);
    /* Type icons in header row */
    --ticon:     clamp(22px, 5.5vw, 32px);
    /* Tab-bar icon size */
    --tab-sz:    clamp(44px, 11vw, 68px);
  }
  /* Tiny phones (≤360px): tighten further & reduce padding */
  @media (max-width: 360px) {
    :root { --cell: 24px; --name-w: 58px; --cell-font: 14px; --ticon: 20px; }
    .content { padding: 8px !important; }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  /* Lock the page itself: no page-level scroll or rubber-band bounce. */
  html, body { overflow: hidden; overscroll-behavior: none; }

  /* Background video with dark fallback */
  #bg-video {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center; z-index: -1; background: #0a2818;
  }

  body { color: #0c3; }

  .app {
    position: relative;
    height: 100vh;
    height: 100dvh; /* iOS 15.4+: accounts for browser chrome, avoids content hiding behind toolbar */
    display: flex; flex-direction: column;
  }

  .content {
    flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    /* Keep content clear of the notch/corners, and leave room for the fixed tab bar. */
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             calc(var(--tab-sz) + 28px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }

  /* ---------- Reset button ---------- */
  .reset-btn {
    position: absolute; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); z-index: 50;
    width: clamp(80px, 20vw, 120px); height: clamp(40px, 10vw, 60px);
    border: none; background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .reset-btn img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .reset-btn .fallback {
    background: #0a7c3a; color: #fff; padding: 10px 16px; border-radius: 10px;
    font-weight: bold; font-size: 14px; pointer-events: none;
  }

  /* ---------- Tab 1: Table ---------- */
  /* Center the table + point box vertically and horizontally in the content area.
     overflow:hidden locks the home display so it never moves/scrolls on a swipe. */
  .content.tab-1 { display: flex; overflow: hidden; }
  .content.tab-1 > .tab1-wrap { margin: auto; }
  .tab1-wrap { display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 2vh, 24px); padding: 8px 0; }
  .table { display: inline-block; }
  .trow { display: flex; align-items: center; }
  /* Header label: EXACT same box as a .name-input (same width var(--name-w),
     same height var(--cell), same margin), so it lines up perfectly. */
  .theader {
    width: var(--name-w); height: var(--cell); margin: 0 1px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-weight: bold; color: #043; background: rgba(255,255,255,0.82); border-radius: 6px;
    font-size: clamp(9px, 2.4vw, 12px); line-height: 1.02; overflow: hidden; padding: 0 2px;
  }
  /* Header type-icons: thicker green box so they read as part of the table.
     Uses .cell.icon-cell to beat .cell's own 1px border (defined later). */
  .cell.icon-cell { border: 2px solid green; border-radius: 4px; }
  .ticon { width: var(--ticon); height: var(--ticon); object-fit: contain; }
  .ticon-fallback {
    width: var(--ticon); height: var(--ticon); border-radius: 50%; background: #0a7c3a; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold;
  }
  /* Height matches the grid cells (--cell) so name rows align with icon rows. */
  .name-input {
    width: var(--name-w); height: var(--cell); margin: 0 1px; box-sizing: border-box;
    border: 1px solid green; padding: 0 6px;
    text-align: center; background: rgba(255,255,255,0.2); color: #000; outline: none;
    font-size: clamp(11px, 3vw, 14px);
  }
  .cell {
    width: var(--cell); height: var(--cell); border: 1px solid green; margin: 0 1px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; user-select: none; background: transparent;
  }
  .cell.x-red { background: #d62828; }
  .cell.checked { background: green; }
  .cell-text { font-weight: bold; font-size: var(--cell-font); line-height: 1; color: #000; }

  /* ---------- Point tracker ---------- */
  .point-box {
    position: relative;
    background: #e0fff1; border-radius: 12px; width: clamp(220px, 80vw, 300px);
    padding: clamp(8px, 2vh, 16px); display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .point-label { font-size: clamp(16px, 4vw, 25px); font-weight: bold; color: #043; }
  .point-value {
    /* Scale with both width and height so it doesn't push content off screen on short phones */
    font-size: clamp(48px, min(18vw, 11vh), 96px); font-weight: bold; color: green; line-height: 1;
    margin: -4px 0; background: none; border: none; cursor: pointer;
  }
  .add-btn {
    position: absolute; right: 12px; bottom: 12px;
    background: green; border: none; border-radius: 50%; padding: 0;
    width: clamp(34px, 9vw, 48px); height: clamp(34px, 9vw, 48px);
    color: #e0fff1; font-size: clamp(22px, 6vw, 34px); font-weight: bold; cursor: pointer; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }

  /* ---------- Tab 2: Cards ---------- */
  .filter-icons {
    display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(6px, 2vw, 12px);
    margin-bottom: 16px;
  }
  .filter-icon { cursor: pointer; background: none; border: none; padding: 0; }
  .filter-icon img, .filter-icon .ic-fallback {
    width: clamp(36px, 9vw, 52px); height: clamp(36px, 9vw, 52px);
    object-fit: contain; opacity: 0.4; transition: opacity .15s;
  }
  .filter-icon.selected img, .filter-icon.selected .ic-fallback { opacity: 1; }
  .ic-fallback {
    border-radius: 50%; background: #0a7c3a; color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px;
  }
  /* 3 cols on phones, 4 on mid-size, 5 on tablets+ */
  .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (min-width: 480px) { .card-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 680px) { .card-grid { grid-template-columns: repeat(5, 1fr); } }

  .card-item { cursor: pointer; border-radius: 8px; overflow: hidden; aspect-ratio: 1; }
  .card-item img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .card-item .card-fallback {
    width: 100%; height: 100%; background: #0a7c3a22; border: 1px solid #0a7c3a;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: 12px; color: #043; padding: 6px; border-radius: 8px;
  }

  /* ---------- Tab 3: Rulebook ---------- */
  .rulebook-wrap { display: flex; flex-direction: column; height: 100%; gap: 12px; }
  .pdf-open-btn {
    align-self: center; background: #e0fff1; color: #000; font-weight: bold;
    padding: 10px 22px; border-radius: 10px; text-decoration: none; font-size: 16px;
    border: 1px solid #0a7c3a;
  }
  .pdf-pages {
    flex: 1 1 auto; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    background: #fff; border-radius: 8px; padding: 10px;
  }
  .pdf-page { width: 100%; max-width: 900px; height: auto; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
  .pdf-loading { color: #043; padding: 24px; text-align: center; }

  /* ---------- Tab bar ---------- */
  /* Translucent ribbon locked to the bottom; slides away on swipe-down. */
  .tab-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    display: flex; justify-content: space-around; align-items: center;
    padding: 14px 8px 8px; gap: 8px;
    background: rgba(0, 0, 0, 0.35);
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
    transition: transform 0.3s ease;
  }
  .tab-bar.hidden { transform: translateY(100%); }
  /* little grab handle to signal it's swipeable */
  .tab-bar::before {
    content: ''; position: absolute; top: 5px; left: 50%; transform: translateX(-50%);
    width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.5);
  }
  .tab-button { background: none; border: none; cursor: pointer; padding: 4px; }
  .tab-button img { height: var(--tab-sz); width: var(--tab-sz); object-fit: contain; }
  .tab-button .tab-fallback {
    height: var(--tab-sz); width: calc(var(--tab-sz) * 1.3); border-radius: 10px;
    background: #0a7c3a; color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px;
    opacity: 0.6;
  }
  .tab-button.active .tab-fallback { opacity: 1; }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-box {
    background: #f7f7f7; border-radius: 12px; padding: 24px; width: 90%; max-width: 400px;
    display: flex; flex-direction: column; align-items: center; position: relative;
  }
  .modal-title { font-size: 20px; font-weight: bold; margin-bottom: 20px; color: #111; }
  .modal-input {
    border: 1px solid green; width: 80%; padding: 10px; font-size: 18px;
    text-align: center; border-radius: 8px; margin-bottom: 20px; outline: none;
  }
  .modal-confirm {
    background: green; color: #fff; border: none; font-weight: bold; font-size: 18px;
    padding: 10px 40px; border-radius: 12px; cursor: pointer;
  }
  .modal-cancel {
    background: #ccc; color: #222; border: none; font-weight: bold; font-size: 18px;
    padding: 10px 32px; border-radius: 12px; cursor: pointer;
  }
  .modal-message { font-size: 16px; color: #333; text-align: center; margin-bottom: 20px; line-height: 1.4; }
  .dialog-buttons { display: flex; gap: 12px; }
  /* number pad */
  .num-pad { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .num-row { display: flex; gap: 16px; }
  .num-btn {
    width: 60px; height: 60px; border-radius: 10px; background: #a4fba6; border: none;
    font-size: 24px; font-weight: bold; color: green; cursor: pointer;
  }
  .num-spacer { width: 60px; }

  /* fullscreen card modal */
  .fs-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.9);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 200;
  }
  .fs-overlay[hidden] { display: none; }
  .fs-overlay img { max-width: 92vw; max-height: 88vh; border-radius: 12px; object-fit: contain; }
  .fs-overlay .card-fallback { width: 60%; height: 60%; font-size: 18px; }
  .fs-close {
    position: absolute; top: 40px; right: 20px; background: rgba(255,255,255,0.2);
    color: #fff; border: none; padding: 10px 16px; border-radius: 20px;
    font-size: 18px; font-weight: bold; cursor: pointer; z-index: 2;
  }
  .fs-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.22); color: #fff; border: none;
    width: 52px; height: 84px; font-size: 40px; line-height: 1; cursor: pointer;
    border-radius: 10px; display: flex; align-items: center; justify-content: center; z-index: 2;
  }
  .fs-prev { left: 10px; }
  .fs-next { right: 10px; }

  /* ---------- Landscape ---------- */
  @media (orientation: landscape) {
    .tab1-wrap { flex-direction: row; align-items: center; justify-content: center; padding-top: 16px; }
  }

  /* Landscape on small phones: cells were sized by vw (now the wide axis),
     so switch to vh-based sizing to fit 9 rows in the short screen height. */
  /* All landscape (phones, tablets, desktop): vertical point widget, table fills. */
  @media (orientation: landscape) {
    /* Size cells off height so the 9 rows grow to fill the landscape screen */
    :root {
      --cell:      clamp(22px, 7.5vh, 48px);
      --name-w:    clamp(56px, 12vw, 90px);
      --cell-font: clamp(12px, 3.5vh, 24px);
      --ticon:     clamp(18px, 5vh, 30px);
      --tab-sz:    clamp(36px, 9vw, 52px);
    }
    /* stretch makes the point box match the table's height = tall vertical widget */
    .tab1-wrap  { padding: 6px 0 !important; gap: 14px !important; align-items: stretch !important; }
    .point-box  {
      width: clamp(110px, 24vw, 170px) !important; padding: 10px !important;
      align-self: stretch !important; justify-content: center !important;
    }
    .point-value { font-size: clamp(40px, min(14vw, 16vh), 90px) !important; margin: 0 !important; }
    .point-label { font-size: clamp(13px, 3vh, 18px) !important; }
    .add-btn    { width: 34px !important; height: 34px !important; font-size: 22px !important; }
  }

  /* ---------- Wide screens (tablet / desktop) ---------- */
  @media (min-width: 640px) {
    /* Centre the score table with breathing room on sides */
    .tab1-wrap > .table { margin: 0 auto; }
  }
</style>
</head>
<body>
<div class="app">
  <video id="bg-video" autoplay loop muted playsinline>
    <source src="./assets/App_Background_HD.mp4" type="video/mp4" />
  </video>

  <button class="reset-btn" id="reset-btn" title="Reset Game">
    <img src="./assets/Buttons/Reset_Button.png" alt="Reset"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
    <span class="fallback" style="display:none;">Reset</span>
  </button>

  <div class="content" id="content"></div>

  <div class="tab-bar" id="tab-bar"></div>
</div>

<!-- Add / Override points modal -->
<div class="modal-overlay" id="points-modal" hidden>
  <div class="modal-box" id="points-modal-box"></div>
</div>

<!-- Fullscreen card modal -->
<div class="fs-overlay" id="fs-modal" hidden>
  <button class="fs-close" id="fs-close">Close</button>
  <div id="fs-content"></div>
</div>

<!-- Generic dialog (confirm / notice) -->
<div class="modal-overlay" id="dialog-modal" hidden>
  <div class="modal-box" id="dialog-box"></div>
</div>

<script>
/* ============================================================
   DATA  (mirrors the original abilityImages / ICONS structure)
   ============================================================ */
const ICONS = [
  { key: 'S', label: 'Scorpion', icon: './assets/Scorpion_ICON.png' },
  { key: 'P', label: 'Poison',   icon: './assets/Poison_ICON.png'   },
  { key: 'T', label: 'Tree',     icon: './assets/Tree_ICON.png'     },
  { key: 'W', label: 'Wood',     icon: './assets/Wood_ICON.png'     },
  { key: 'G', label: 'Glass',    icon: './assets/Glass_ICON.png'    },
  { key: 'B', label: 'Bull',     icon: './assets/Bull_ICON.png'     },
  { key: 'H', label: 'Horned',   icon: './assets/Horned_ICON.png'   },
  { key: 'R', label: 'Rain',     icon: './assets/Rain_ICON.png'     },
];
const ICON_KEYS = ICONS.map(i => i.key);

// tags reference icon keys
const ABILITY_IMAGES = [
  { src: './assets/Players/Scorpion.png', name: 'Scorpion', tags: ['S'] },
  { src: './assets/Players/Poison.png',   name: 'Poison',   tags: ['P'] },
  { src: './assets/Players/Tree.png',     name: 'Tree',     tags: ['T'] },
  { src: './assets/Players/Wood.png',     name: 'Wood',     tags: ['W'] },
  { src: './assets/Players/Glass.png',    name: 'Glass',    tags: ['G'] },
  { src: './assets/Players/Bull.png',     name: 'Bull',     tags: ['B'] },
  { src: './assets/Players/Horned.png',   name: 'Horned',   tags: ['H'] },
  { src: './assets/Players/Rain.png',     name: 'Rain',     tags: ['R'] },
  { src: './assets/Abilities/Ability_Action_Surge.png',    name: 'Action Surge',    tags: ['S','T','W','B','H'] },
  { src: './assets/Abilities/Ability_Compost_Bin.png',     name: 'Compost Bin',     tags: ['S','T','W','B','H'] },
  { src: './assets/Abilities/Ability_Deal_Broker.png',     name: 'Deal Broker',     tags: ['S','P','G','B','H'] },
  { src: './assets/Abilities/Ability_Deflect.png',         name: 'Deflect',         tags: ['S','P','G','B','H'] },
  { src: './assets/Abilities/Ability_Diversion.png',       name: 'Diversion',       tags: ['S','P','R'] },
  { src: './assets/Abilities/Ability_Double_Up.png',       name: 'Double Up',       tags: ['S','T','W','R'] },
  { src: './assets/Abilities/Ability_Elite_Forager.png',   name: 'Elite Forager',   tags: ['S','P','T','W','B'] },
  { src: './assets/Abilities/Ability_Frog_Charm.png',      name: 'Frog Charm',      tags: ['S','T','W','G','B'] },
  { src: './assets/Abilities/Ability_Joint_Reward.png',    name: 'Joint Reward',    tags: ['S','P','T','W','R'] },
  { src: './assets/Abilities/Ability_Keen_Sight.png',      name: 'Keen Sight',      tags: ['S','P','G','B','H'] },
  { src: './assets/Abilities/Ability_Love_Retrieval.png',  name: 'Love Retrieval',  tags: ['G','B','R'] },
  { src: './assets/Abilities/Ability_Quick_Draw.png',      name: 'Quick Draw',      tags: ['S','P','G','H','R'] },
  { src: './assets/Abilities/Ability_Revealer.png',        name: 'Revealer',        tags: ['S','P','W','G','R'] },
  { src: './assets/Abilities/Ability_Scorpions_Claw.png',  name: "Scorpion's Claw", tags: ['S','P','R'] },
  { src: './assets/Abilities/Ability_Scramble.png',        name: 'Scramble',        tags: ['S','T','W','H'] },
  { src: './assets/Abilities/Ability_Spirit_Link.png',     name: 'Spirit Link',     tags: ['S','T','G','H','R'] },
  { src: './assets/Abilities/Ability_Summoner.png',        name: 'Summoner',        tags: ['S','W','B','R'] },
  { src: './assets/Abilities/Ability_Truth_Retrieval.png', name: 'Truth Retrieval', tags: ['G','H','R'] },
  { src: './assets/Abilities/Ability_Poison.png',          name: 'Poison',          tags: ['S','P'] },
  { src: './assets/Abilities/Ability_Antidote.png',        name: 'Antidote',        tags: ['S','P','T','W','G','B','H','R'] },
  { src: './assets/Abilities/Ability_Love_Potion.png',     name: 'Love Potion',     tags: ['S','P','T','W','G','B','H','R'] },
  { src: './assets/Abilities/Ability_Truth_Serum.png',     name: 'Truth Serum',     tags: ['S','P','T','W','G','B','H','R'] },
];

const TAB_ICONS = [
  { src: './assets/Buttons/Home_Tab.png',     label: 'Home' },
  { src: './assets/Buttons/Cards_Tab.png',    label: 'Cards' },
  { src: './assets/Buttons/Rulebook_Tab.png', label: 'Rules' },
];

const RULEBOOK_PDF = './assets/App_Rulebook.pdf';

/* ============================================================
   STATE
   ============================================================ */
const state = {
  activeTab: 1,                                  // 1=table, 2=cards, 3=rulebook
  playerNames: Array(8).fill(''),
  // cell values cycle 0 -> 1 (faint X) -> 2 (solid X) -> 3 (check) -> 0
  tableData: Array.from({ length: 8 }, () => Array(8).fill(0)),
  points: 0,
  selectedIcons: [],                             // array of icon keys
  fullscreenCard: null,                          // index into filtered list
  modal: null,                                   // null | 'add' | 'override'
  inputValue: '',
};

/* ============================================================
   PERSISTENCE (per-device, private — no backend)
   Saves only the durable game data, not transient UI state like
   open dialogs or in-progress input. Wrapped in try/catch so the
   app still works if storage is unavailable (e.g. iOS private mode).
   ============================================================ */
const STORAGE_KEY = 'gameCompanion.v2';

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      playerNames: state.playerNames,
      tableData: state.tableData,
      points: state.points,
      selectedIcons: state.selectedIcons,
    }));
  } catch (e) {
    /* storage full or blocked — fail silently, app keeps working in-memory */
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    // Validate shape before trusting it, so a corrupt/old blob can't break startup.
    if (Array.isArray(saved.playerNames) && saved.playerNames.length === 8) {
      state.playerNames = saved.playerNames.map(n => (typeof n === 'string' ? n : ''));
    }
    if (Array.isArray(saved.tableData) && saved.tableData.length === 8
        && saved.tableData.every(row => Array.isArray(row) && row.length === 8)) {
      state.tableData = saved.tableData.map(row => row.map(v => (Number.isInteger(v) && v >= 0 && v <= 4 ? v : 0)));
    }
    if (typeof saved.points === 'number' && saved.points >= 0) {
      state.points = saved.points;
    }
    if (Array.isArray(saved.selectedIcons)) {
      // keep only icon keys we actually recognize
      state.selectedIcons = saved.selectedIcons.filter(k => ICON_KEYS.includes(k));
    }
  } catch (e) {
    /* corrupt data — ignore and start fresh */
  }
}

/* ============================================================
   HELPERS
   ============================================================ */
const $ = sel => document.querySelector(sel);
const el = (tag, props = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) node.setAttribute(k, v);
  }
  for (const c of children) if (c) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  return node;
};
// image that swaps to a fallback element on error
const imgOrFallback = (src, imgClass, fallbackNode) => {
  const wrap = el('span', { style: 'display:contents' });
  const image = el('img', { src, class: imgClass || '', alt: '' });
  image.addEventListener('error', () => { image.remove(); wrap.appendChild(fallbackNode); });
  wrap.appendChild(image);
  return wrap;
};
// Compressed JPG thumbnail path (same basename) for a card's original PNG src.
function thumbSrc(src) {
  const file = src.split('/').pop().replace(/\.png$/i, '.jpg');
  return './assets/Compressed%20Assets/' + file;
}
// Card grid thumbnail: load fast compressed JPG, fall back to original PNG, then text.
function cardThumb(card) {
  const wrap = el('span', { style: 'display:contents' });
  const image = el('img', { src: thumbSrc(card.src), alt: '' });
  let stage = 0;
  image.addEventListener('error', () => {
    if (stage === 0) { stage = 1; image.src = card.src; }
    else { image.remove(); wrap.appendChild(el('div', { class: 'card-fallback', text: card.name })); }
  });
  wrap.appendChild(image);
  return wrap;
}

/* ============================================================
   RENDER: TAB 1 — TABLE + POINT TRACKER
   ============================================================ */
function renderTable() {
  const wrap = el('div', { class: 'tab1-wrap' });

  const table = el('div', { class: 'table' });

  // header row
  const header = el('div', { class: 'trow' });
  header.appendChild(el('div', { class: 'theader', text: 'Player Name' }));
  ICONS.forEach(ic => {
    const cell = el('div', { class: 'cell icon-cell' });
    cell.appendChild(imgOrFallback(ic.icon, 'ticon', el('div', { class: 'ticon-fallback', text: ic.key })));
    header.appendChild(cell);
  });
  table.appendChild(header);

  // player rows
  state.playerNames.forEach((name, r) => {
    const row = el('div', { class: 'trow' });
    const nameInput = el('input', {
      class: 'name-input',
      placeholder: `Player ${r + 1}`,
      value: name,
      oninput: e => { state.playerNames[r] = e.target.value; saveState(); },
    });
    // Enter key advances focus to the next player-name field.
    nameInput.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const inputs = Array.from(document.querySelectorAll('.name-input'));
      const idx = inputs.indexOf(e.target);
      if (idx > -1 && idx < inputs.length - 1) inputs[idx + 1].focus();
      else e.target.blur();
    });
    row.appendChild(nameInput);
    ICONS.forEach((_, c) => {
      const v = state.tableData[r][c];
      // states: 0 blank | 1 X (transparent) | 2 X (red bg) | 3 ✓ (transparent) | 4 ✓ (green bg)
      const cls = 'cell' + (v === 2 ? ' x-red' : '') + (v === 4 ? ' checked' : '');
      const cell = el('div', { class: cls });
      const t = el('span', { class: 'cell-text' });
      if (v === 1 || v === 2) t.textContent = 'X';
      else if (v === 3 || v === 4) t.textContent = '✓';
      cell.appendChild(t);
      cell.addEventListener('click', () => {
        state.tableData[r][c] = (state.tableData[r][c] + 1) % 5;
        render();
      });
      row.appendChild(cell);
    });
    table.appendChild(row);
  });

  wrap.appendChild(table);

  // point tracker
  const box = el('div', { class: 'point-box' });
  box.appendChild(el('div', { class: 'point-label', text: 'Point Total' }));
  box.appendChild(el('button', { class: 'point-value', text: String(state.points), onclick: openOverride }));
  box.appendChild(el('button', { class: 'add-btn', text: '+', onclick: openAddPoints }));
  wrap.appendChild(box);

  return wrap;
}

/* ============================================================
   RENDER: TAB 2 — CARD BROWSER
   ============================================================ */
function getFilteredImages() {
  const sel = state.selectedIcons;
  if (sel.length === 0 || sel.length === ICONS.length) return ABILITY_IMAGES;
  return ABILITY_IMAGES.filter(img => img.tags.some(t => sel.includes(t)));
}

function renderCards() {
  const wrap = el('div');

  // filter icons
  const filterRow = el('div', { class: 'filter-icons' });
  ICONS.forEach(ic => {
    const selected = state.selectedIcons.includes(ic.key);
    const btn = el('button', { class: 'filter-icon' + (selected ? ' selected' : '') });
    btn.appendChild(imgOrFallback(ic.icon, '', el('div', { class: 'ic-fallback', text: ic.key })));
    btn.addEventListener('click', () => {
      state.selectedIcons = selected
        ? state.selectedIcons.filter(k => k !== ic.key)
        : [...state.selectedIcons, ic.key];
      render();
    });
    filterRow.appendChild(btn);
  });
  wrap.appendChild(filterRow);

  // card grid
  const filtered = getFilteredImages();
  const grid = el('div', { class: 'card-grid' });
  filtered.forEach((card, i) => {
    const item = el('div', { class: 'card-item', onclick: () => { state.fullscreenCard = i; render(); } });
    item.appendChild(cardThumb(card));
    grid.appendChild(item);
  });
  wrap.appendChild(grid);

  return wrap;
}

/* ============================================================
   RENDER: TAB 3 — RULEBOOK
   ============================================================ */
/* The rulebook is rendered page-by-page with pdf.js into a scrollable column.
   This is necessary because iOS Safari only shows the first page of a PDF in an
   <iframe>/<embed>. pdf.js is loaded lazily from a CDN (the one external
   dependency, added deliberately to make the in-page preview scrollable).
   Rendered pages are cached so re-visiting the tab is instant. */
let rulebookPagesHTML = null;   // cached <img> markup of rendered pages
let rulebookRendering = false;

function ensurePdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      resolve(window.pdfjsLib);
    };
    s.onerror = () => reject(new Error('pdf.js failed to load'));
    document.head.appendChild(s);
  });
}

async function loadRulebook(container) {
  if (rulebookRendering) return;
  rulebookRendering = true;
  try {
    const pdfjsLib = await ensurePdfJs();
    const pdf = await pdfjsLib.getDocument(RULEBOOK_PDF).promise;
    const targetW = Math.min((container.clientWidth || 800) - 20, 1000);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const imgs = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const base = page.getViewport({ scale: 1 });
      const viewport = page.getViewport({ scale: (targetW / base.width) * dpr });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width; canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      imgs.push('<img class="pdf-page" alt="Page ' + p + '" src="' + canvas.toDataURL('image/jpeg', 0.85) + '" />');
    }
    rulebookPagesHTML = imgs.join('');
    const live = document.getElementById('pdf-pages');
    if (live) live.innerHTML = rulebookPagesHTML;
  } catch (e) {
    const live = document.getElementById('pdf-pages');
    if (live) live.innerHTML = '<div class="pdf-loading">Preview unavailable — use the “Open Rulebook PDF” button above.</div>';
  } finally {
    rulebookRendering = false;
  }
}

function renderRulebook() {
  const wrap = el('div', { class: 'rulebook-wrap' });
  // Button is the first thing visible; the scrollable page preview sits below it.
  wrap.appendChild(el('a', { class: 'pdf-open-btn', href: RULEBOOK_PDF, target: '_blank', text: 'Open Rulebook PDF' }));
  const pages = el('div', { class: 'pdf-pages', id: 'pdf-pages' });
  if (rulebookPagesHTML) {
    pages.innerHTML = rulebookPagesHTML;            // cached — instant
  } else {
    pages.appendChild(el('div', { class: 'pdf-loading', text: 'Loading rulebook…' }));
    setTimeout(() => loadRulebook(pages), 0);       // render after it's in the DOM (needs clientWidth)
  }
  wrap.appendChild(pages);
  return wrap;
}

/* ============================================================
   MODALS
   ============================================================ */
function openAddPoints() { state.modal = 'add'; state.inputValue = ''; render(); }
function openOverride()  { state.modal = 'override'; render(); }
function closeModal()     { state.modal = null; render(); }

/* Generic in-page dialogs (replace native alert/confirm so they work
   reliably on every browser, including mobile Safari). */
function closeDialog() {
  const overlay = $('#dialog-modal');
  overlay.hidden = true;
  $('#dialog-box').innerHTML = '';
}

function showNotice(title, message) {
  const box = $('#dialog-box');
  box.innerHTML = '';
  box.appendChild(el('div', { class: 'modal-title', text: title }));
  if (message) box.appendChild(el('div', { class: 'modal-message', text: message }));
  box.appendChild(el('button', { class: 'modal-confirm', text: 'OK', onclick: closeDialog }));
  $('#dialog-modal').hidden = false;
}

function showConfirm(title, message, onConfirm) {
  const box = $('#dialog-box');
  box.innerHTML = '';
  box.appendChild(el('div', { class: 'modal-title', text: title }));
  if (message) box.appendChild(el('div', { class: 'modal-message', text: message }));
  const row = el('div', { class: 'dialog-buttons' });
  row.appendChild(el('button', { class: 'modal-cancel', text: 'Cancel', onclick: closeDialog }));
  row.appendChild(el('button', { class: 'modal-confirm', text: 'Reset', onclick: () => { closeDialog(); onConfirm(); } }));
  box.appendChild(row);
  $('#dialog-modal').hidden = false;
}

function handleAddPoints() {
  const added = parseInt(state.inputValue || '0', 10);
  if (isNaN(added)) { showNotice('Invalid input', 'Please enter a number.'); return; }
  const total = state.points + added;
  const cardsToDraw = Math.floor(total / 10);
  state.points = total % 10;
  state.modal = null; state.inputValue = '';
  render();
  if (cardsToDraw > 0) {
    showNotice('Ancient Ability Learned!', `Draw ${cardsToDraw} Ancient Ability card${cardsToDraw > 1 ? 's' : ''}`);
  }
}

function handleOverride(num) { state.points = num; state.modal = null; render(); }

function renderPointsModal() {
  const box = $('#points-modal-box');
  box.innerHTML = '';
  const overlay = $('#points-modal');

  if (!state.modal) { overlay.hidden = true; return; }
  overlay.hidden = false;

  if (state.modal === 'override') {
    box.appendChild(el('div', { class: 'modal-title', text: 'Points Override' }));
    const pad = el('div', { class: 'num-pad' });
    [[1,2,3],[4,5,6],[7,8,9]].forEach(rowNums => {
      const row = el('div', { class: 'num-row' });
      rowNums.forEach(n => row.appendChild(el('button', { class: 'num-btn', text: String(n), onclick: () => handleOverride(n) })));
      pad.appendChild(row);
    });
    // last row: 0 centered
    const last = el('div', { class: 'num-row' });
    last.appendChild(el('div', { class: 'num-spacer' }));
    last.appendChild(el('button', { class: 'num-btn', text: '0', onclick: () => handleOverride(0) }));
    last.appendChild(el('div', { class: 'num-spacer' }));
    pad.appendChild(last);
    box.appendChild(pad);
  } else { // add
    box.appendChild(el('div', { class: 'modal-title', text: 'Enter points to add:' }));
    const input = el('input', {
      class: 'modal-input', type: 'number', inputmode: 'numeric', value: state.inputValue,
      oninput: e => { state.inputValue = e.target.value; },
    });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') handleAddPoints(); });
    box.appendChild(input);
    box.appendChild(el('button', { class: 'modal-confirm', text: 'Confirm', onclick: handleAddPoints }));
    // focus the field
    setTimeout(() => input.focus(), 0);
  }
}

function renderFullscreen() {
  const overlay = $('#fs-modal');
  const content = $('#fs-content');
  content.innerHTML = '';
  if (state.fullscreenCard === null) { overlay.hidden = true; return; }
  const filtered = getFilteredImages();
  const total = filtered.length;
  const card = filtered[state.fullscreenCard];
  if (!card) { overlay.hidden = true; return; }
  overlay.hidden = false;
  // Fullscreen uses the full-quality original PNG, not the compressed thumbnail.
  content.appendChild(imgOrFallback(card.src, '', el('div', { class: 'card-fallback', text: card.name })));
  if (total > 1) {
    content.appendChild(el('button', {
      class: 'fs-nav fs-prev', text: '‹',
      onclick: e => { e.stopPropagation(); state.fullscreenCard = (state.fullscreenCard - 1 + total) % total; render(); },
    }));
    content.appendChild(el('button', {
      class: 'fs-nav fs-next', text: '›',
      onclick: e => { e.stopPropagation(); state.fullscreenCard = (state.fullscreenCard + 1) % total; render(); },
    }));
  }
}

/* ============================================================
   TAB BAR + ROOT RENDER
   ============================================================ */
function renderTabBar() {
  const bar = $('#tab-bar');
  bar.innerHTML = '';
  TAB_ICONS.forEach((t, i) => {
    const active = state.activeTab === i + 1;
    const btn = el('button', { class: 'tab-button' + (active ? ' active' : ''), onclick: () => { state.activeTab = i + 1; render(); } });
    btn.appendChild(imgOrFallback(t.src, '', el('div', { class: 'tab-fallback', text: t.label })));
    bar.appendChild(btn);
  });
}

function render() {
  const content = $('#content');
  content.className = 'content tab-' + state.activeTab;  // enables per-tab layout (e.g. centering tab 1)
  content.innerHTML = '';
  if (state.activeTab === 1) content.appendChild(renderTable());
  else if (state.activeTab === 2) content.appendChild(renderCards());
  else if (state.activeTab === 3) content.appendChild(renderRulebook());

  // reset button only on tab 1
  $('#reset-btn').style.display = state.activeTab === 1 ? 'flex' : 'none';

  renderTabBar();
  renderPointsModal();
  renderFullscreen();

  // Persist durable game data after every state-changing render.
  saveState();
}

/* ============================================================
   GLOBAL EVENTS
   ============================================================ */
$('#reset-btn').addEventListener('click', () => {
  showConfirm('Reset Game?', 'Are you sure you want to start a new game?', () => {
    state.playerNames = Array(8).fill('');
    state.tableData = Array.from({ length: 8 }, () => Array(8).fill(0));
    state.points = 0;
    render();
  });
});

$('#points-modal').addEventListener('click', e => { if (e.target.id === 'points-modal') closeModal(); });
$('#dialog-modal').addEventListener('click', e => { if (e.target.id === 'dialog-modal') closeDialog(); });
$('#fs-close').addEventListener('click', () => { state.fullscreenCard = null; render(); });
$('#fs-modal').addEventListener('click', e => { if (e.target.id === 'fs-modal') { state.fullscreenCard = null; render(); } });

// Fullscreen card navigation — keyboard arrows (desktop) + touch swipe (mobile).
document.addEventListener('keydown', e => {
  if (state.fullscreenCard === null) return;
  const total = getFilteredImages().length;
  if (e.key === 'ArrowRight') { state.fullscreenCard = (state.fullscreenCard + 1) % total; render(); }
  else if (e.key === 'ArrowLeft') { state.fullscreenCard = (state.fullscreenCard - 1 + total) % total; render(); }
  else if (e.key === 'Escape') { state.fullscreenCard = null; render(); }
});
let fsTouchX = null;
$('#fs-modal').addEventListener('touchstart', e => { fsTouchX = e.changedTouches[0].clientX; }, { passive: true });
$('#fs-modal').addEventListener('touchend', e => {
  if (fsTouchX === null || state.fullscreenCard === null) return;
  const dx = e.changedTouches[0].clientX - fsTouchX; fsTouchX = null;
  if (Math.abs(dx) < 40) return;
  const total = getFilteredImages().length;
  state.fullscreenCard = dx < 0 ? (state.fullscreenCard + 1) % total : (state.fullscreenCard - 1 + total) % total;
  render();
});

// Tab ribbon: a vertical swipe ANYWHERE on screen toggles it (down = hide, up =
// reveal). Only the ribbon moves — the display never scrolls (locked above).
// Horizontal swipes are ignored here so fullscreen card navigation still works.
const tabBarEl = $('#tab-bar');
let swipeStartX = null, swipeStartY = null;
document.addEventListener('touchstart', e => {
  swipeStartX = e.touches[0].clientX; swipeStartY = e.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (swipeStartY === null) return;
  const dx = e.changedTouches[0].clientX - swipeStartX;
  const dy = e.changedTouches[0].clientY - swipeStartY;
  swipeStartX = swipeStartY = null;
  if (Math.abs(dy) < 40 || Math.abs(dy) <= Math.abs(dx)) return;  // need a clear vertical swipe
  tabBarEl.classList.toggle('hidden', dy > 0);                    // down hides, up reveals
}, { passive: true });

loadState();
render();

// Asset load ordering:
//  1) the browser loads the immediate page assets (icons, buttons, video) — we
//     wait for window 'load' so those finish first;
//  2) then we warm the compressed card thumbnails (the next thing a user sees);
//  3) only once those are done do we pull the heavy full-res originals in the
//     background, so they never compete with anything the user is waiting on.
function preloadAll(urls) {
  return Promise.all(urls.map(u => new Promise(res => {
    const img = new Image();
    img.onload = img.onerror = res;
    img.src = u;
  })));
}
window.addEventListener('load', () => {
  const compressed = ABILITY_IMAGES.map(card => thumbSrc(card.src));
  preloadAll(compressed).then(() => {
    // high-res, fire-and-forget in the background
    ABILITY_IMAGES.forEach(card => { const img = new Image(); img.src = card.src; });
  });
});
</script>
</body>

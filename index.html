    font-size: 18px; font-weight: bold; cursor: pointer; z-index: 2;
  }
  .fs-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.22); color: #fff; border: none;
    width: 52px; height: 84px; font-size: 40px; line-height: 1; cursor: pointer;
    border-radius: 10px; display: flex; align-items: center; justify-content: center; z-index: 2;
  }
  .fs-prev { left: 10px; }
  .fs-next { right: 10px; }

  /* ---------- Landscape ---------- */
  @media (orientation: landscape) {
    .tab1-wrap { flex-direction: row; align-items: center; justify-content: center; padding-top: 16px; }
  }

  /* Landscape on small phones: cells were sized by vw (now the wide axis),
     so switch to vh-based sizing to fit 9 rows in the short screen height. */
  /* All landscape (phones, tablets, desktop): vertical point widget, table fills. */
  @media (orientation: landscape) {
    /* Size cells off height so the 9 rows grow to fill the landscape screen */
    :root {
      --cell:      clamp(22px, 7.5vh, 48px);
      --name-w:    clamp(56px, 12vw, 90px);
      --cell-font: clamp(12px, 3.5vh, 24px);
      --ticon:     clamp(18px, 5vh, 30px);
      --tab-sz:    clamp(36px, 9vw, 52px);
    }
    /* stretch makes the point box match the table's height = tall vertical widget */
    .tab1-wrap  { padding: 6px 0 !important; gap: 14px !important; align-items: stretch !important; }
    .point-box  {
      width: clamp(110px, 24vw, 170px) !important; padding: 10px !important;
      align-self: stretch !important; justify-content: center !important;
    }
    .point-value { font-size: clamp(40px, min(14vw, 16vh), 90px) !important; margin: 0 !important; }
    .point-label { font-size: clamp(13px, 3vh, 18px) !important; }
    .add-btn    { width: 34px !important; height: 34px !important; font-size: 22px !important; }
  }

  /* ---------- Wide screens (tablet / desktop) ---------- */
  @media (min-width: 640px) {
    /* Centre the score table with breathing room on sides */
    .tab1-wrap > .table { margin: 0 auto; }
  }

  .tutorial-btn {
    display: block; width: 150px; height: 49px; margin: 12px auto 0; padding: 12px 24px;
    border: 2px solid rgba(224,255,241,.8); border-radius: 14px; background: rgba(4,76,68,.78);
    color: #e0fff1; font: inherit; font-size: 17px; font-weight: 700; line-height: 1.2;
    box-shadow: 0 4px 12px rgba(0,0,0,.28); cursor: pointer;
  }
  .tutorial-btn:active { transform: scale(.96); }
  #tutorial-dim[hidden], #tutorial-spotlight[hidden], #tutorial-arrow[hidden], #tutorial-ui[hidden] { display: none !important; }
  #tutorial-dim { position: fixed; inset: 0; z-index: 190; background: rgba(0,0,0,.62); pointer-events: none; }
  #tutorial-spotlight {
    position: fixed; z-index: 191; pointer-events: none; border: 3px solid rgba(255,255,255,.98);
    border-radius: 14px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.62), 0 0 18px 5px rgba(255,255,255,.72);
    transition: top .18s ease, left .18s ease, width .18s ease, height .18s ease;
  }
  #tutorial-arrow { position: fixed; inset: 0; z-index: 201; overflow: visible; pointer-events: none; }
  #tutorial-arrow-sprite {
    position: absolute; display: grid; place-items: center; width: 83.52px; height: 83.52px;
    transform-origin: center; will-change: transform;
  }
  #tutorial-arrow-image {
    display: block; width: 83.52px; height: auto; max-width: none; object-fit: contain;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.55)); will-change: transform;
    animation: tutorial-arrow-bob 3.5s infinite;
  }
  @keyframes tutorial-arrow-bob {
    0% {
      transform: translateX(0) rotate(0) scale(1,1);
      animation-timing-function: cubic-bezier(.45,0,.75,.35);
    }
    28.571% {
      transform: translateX(-14px) rotate(-3deg) scale(.9,1.1);
      animation-timing-function: cubic-bezier(.12,.85,.22,1.45);
    }
    30.5% {
      transform: translateX(8px) rotate(2.5deg) scale(1.16,.86);
      animation-timing-function: cubic-bezier(.35,0,.25,1);
    }
    34.5% {
      transform: translateX(-3.5px) rotate(-1.3deg) scale(.96,1.04);
      animation-timing-function: cubic-bezier(.35,0,.25,1);
    }
    38% {
      transform: translateX(1px) rotate(.6deg) scale(1.02,.98);
      animation-timing-function: cubic-bezier(.4,0,.2,1);
    }
    42.857% { transform: translateX(0) rotate(0) scale(1,1); }
    100% { transform: translateX(0) rotate(0) scale(1,1); }
  }
  #tutorial-ui { position: fixed; inset: 0; z-index: 200; pointer-events: none; }
  #tutorial-exit {
    position: absolute; top: 10px; right: 12px; z-index: 202; pointer-events: auto;
    display: grid; place-items: center; width: 34px; height: 34px; padding: 0;
    border: 1px solid rgba(255,255,255,.82); border-radius: 50%; background: rgba(2,46,42,.96);
    color: #fff; font-family: Arial, sans-serif; font-size: 22px; line-height: 1; cursor: pointer;
    box-shadow: 0 3px 12px rgba(0,0,0,.3);
  }
  #tutorial-card {
    position: fixed; width: min(390px, calc(100vw - 32px)); padding: 16px 18px 14px;
    border: 1px solid rgba(255,255,255,.88); border-radius: 18px; background: rgba(3,62,56,.96);
    color: #f1fff9; box-shadow: 0 8px 28px rgba(0,0,0,.38); pointer-events: auto;
  }
  #tutorial-progress { margin-bottom: 7px; padding-right: 48px; color: #b9f5de; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  #tutorial-progress-track { height: 4px; margin-right: 46px; margin-bottom: 12px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.22); }
  #tutorial-progress-fill { height: 100%; width: 0; border-radius: inherit; background: #b9f5de; transition: width .24s ease; }
  #tutorial-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
  #tutorial-back, #tutorial-next { min-width: 94px; padding: 9px 16px; border: 1px solid rgba(255,255,255,.85); border-radius: 12px; color: #fff; font: inherit; font-weight: 750; cursor: pointer; }
  #tutorial-back { background: rgba(255,255,255,.12); }
  #tutorial-back:disabled { opacity: .45; cursor: default; }
  #tutorial-back[hidden] { display: none; }
  #tutorial-next[hidden] { display: block; visibility: hidden; }
  #tutorial-copy { color: #fff; font-size: 16px; font-weight: 600; line-height: 1.45; }
  #tutorial-next { background: #0aa879; margin-left: auto; }
  #tutorial-exit:active, #tutorial-next:active, #tutorial-back:active { transform: scale(.96); }
  @media (max-width: 420px) {
    #tutorial-card { padding: 14px 15px 12px; }
    #tutorial-copy { font-size: 15px; }
  }
  @media (orientation: landscape) {
    #tutorial-card { max-height: calc(100dvh - 16px); overflow-y: auto; overscroll-behavior: contain; }
    #tutorial-actions { gap: 6px; margin-top: 10px; }
    #tutorial-back, #tutorial-next { min-width: 64px; padding: 6px 8px; font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #tutorial-spotlight { transition: none; }
    #tutorial-arrow-image { animation: none; }
  }

</style>
</head>
<body>
<div class="app">
  <video id="bg-video" autoplay loop muted playsinline>
    <source src="./assets/App_Background_HD.mp4" type="video/mp4" />
  </video>

  <button class="reset-btn" id="reset-btn" title="Reset Game">
    <img src="./assets/Buttons/Reset_Button.png" alt="Reset"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
    <span class="fallback" style="display:none;">Reset</span>
  </button>

  <div class="content" id="content"></div>

  <div class="tab-bar" id="tab-bar"></div>
</div>

<!-- Add / Override points modal -->
<div class="modal-overlay" id="points-modal" hidden>
  <div class="modal-box" id="points-modal-box"></div>
</div>

<!-- Fullscreen card modal -->
<div class="fs-overlay" id="fs-modal" hidden>
  <button class="fs-close" id="fs-close">Close</button>
  <div id="fs-content"></div>
</div>

<!-- Generic dialog (confirm / notice) -->
<div class="modal-overlay" id="dialog-modal" hidden>
  <div class="modal-box" id="dialog-box"></div>
</div>

<div id="tutorial-dim" hidden aria-hidden="true"></div>
<div id="tutorial-spotlight" hidden aria-hidden="true"></div>
<div id="tutorial-arrow" hidden aria-hidden="true"><div id="tutorial-arrow-sprite"><img id="tutorial-arrow-image" src="./tutorial-arrow.png" alt="" draggable="false"></div></div>
<div id="tutorial-ui" hidden>
  <section id="tutorial-card" role="dialog" aria-live="polite" aria-label="Site tutorial">
    <button id="tutorial-exit" type="button" aria-label="Exit tour" title="Exit tour">×</button>
    <div id="tutorial-progress"></div>
    <div id="tutorial-progress-track" role="progressbar" aria-label="Tutorial progress" aria-valuemin="0" aria-valuemax="29" aria-valuenow="1"><div id="tutorial-progress-fill"></div></div>
    <p id="tutorial-copy"></p>
    <div id="tutorial-actions"><button id="tutorial-back" type="button">Back</button><button id="tutorial-next" type="button">Next</button></div>
  </section>
</div>

<script>
/* ============================================================
   DATA  (mirrors the original abilityImages / ICONS structure)
   ============================================================ */
const ICONS = [
  { key: 'S', label: 'Scorpion', icon: './assets/Scorpion_ICON.png' },
  { key: 'P', label: 'Poison',   icon: './assets/Poison_ICON.png'   },
  { key: 'T', label: 'Tree',     icon: './assets/Tree_ICON.png'     },
  { key: 'W', label: 'Wood',     icon: './assets/Wood_ICON.png'     },
  { key: 'G', label: 'Glass',    icon: './assets/Glass_ICON.png'    },
  { key: 'B', label: 'Bull',     icon: './assets/Bull_ICON.png'     },
  { key: 'H', label: 'Horned',   icon: './assets/Horned_ICON.png'   },
  { key: 'R', label: 'Rain',     icon: './assets/Rain_ICON.png'     },
];
const ICON_KEYS = ICONS.map(i => i.key);

// tags reference icon keys
const CARD_ASSET_VERSION = 'v5-20260925';
const ABILITY_IMAGES = [
  {"src": "./assets/Players/Scorpion.png", "name": "Scorpion", "tags": ["S"]},
  {"src": "./assets/Players/Poison.png", "name": "Poison", "tags": ["P"]},
  {"src": "./assets/Players/Tree.png", "name": "Tree", "tags": ["T"]},
  {"src": "./assets/Players/Wood.png", "name": "Wood", "tags": ["W"]},
  {"src": "./assets/Players/Glass.png", "name": "Glass", "tags": ["G"]},
  {"src": "./assets/Players/Bull.png", "name": "Bull", "tags": ["B"]},
  {"src": "./assets/Players/Horned.png", "name": "Horned", "tags": ["H"]},
  {"src": "./assets/Players/Rain.png", "name": "Rain", "tags": ["R"]},
  {"src": "./assets/Abilities/Ability_Action_Surge.png", "name": "Action Surge", "tags": ["S", "P", "T", "B"]},
  {"src": "./assets/Abilities/Ability_Compost_Bin.png", "name": "Compost Bin", "tags": ["S", "T", "W", "G", "B", "H"]},
  {"src": "./assets/Abilities/Ability_Cultivator.png", "name": "Cultivator", "tags": ["S", "P", "G", "B", "H", "R"]},
  {"src": "./assets/Abilities/Ability_Deal_Broker.png", "name": "Deal Broker", "tags": ["S", "P", "T", "G", "H"]},
  {"src": "./assets/Abilities/Ability_Deflect.png", "name": "Deflect", "tags": ["S", "W", "G", "H"]},
  {"src": "./assets/Abilities/Ability_Diversion.png", "name": "Diversion", "tags": ["S", "P", "G", "B", "R"]},
  {"src": "./assets/Abilities/Ability_Double_Up.png", "name": "Double Up", "tags": ["S", "T", "W", "B", "H", "R"]},
  {"src": "./assets/Abilities/Ability_Elite_Forager.png", "name": "Elite Forager", "tags": ["S", "T", "W", "G", "B", "R"]},
  {"src": "./assets/Abilities/Ability_Frog_Charm.png", "name": "Frog Charm", "tags": ["S", "T", "W", "G", "B"]},
  {"src": "./assets/Abilities/Ability_Joint_Reward.png", "name": "Joint Reward", "tags": ["S", "P", "T", "W", "H", "R"]},
  {"src": "./assets/Abilities/Ability_Keen_Sight.png", "name": "Keen Sight", "tags": ["S", "P", "G", "B", "H"]},
  {"src": "./assets/Abilities/Ability_Love_Retrieval.png", "name": "Love Retrieval", "tags": ["G", "B", "R"]},
  {"src": "./assets/Abilities/Ability_Quick_Draw.png", "name": "Quick Draw", "tags": ["S", "P", "H", "R"]},
  {"src": "./assets/Abilities/Ability_Revealer.png", "name": "Revealer", "tags": ["S", "P", "T", "W", "R"]},
  {"src": "./assets/Abilities/Ability_Scorpions_Claw.png", "name": "Scorpion's Claw", "tags": ["S", "P", "R"]},
  {"src": "./assets/Abilities/Ability_Scramble.png", "name": "Scramble", "tags": ["S", "P", "T", "W", "H", "R"]},
  {"src": "./assets/Abilities/Ability_Spirit_Link.png", "name": "Spirit Link", "tags": ["S", "G", "B", "H", "R"]},
  {"src": "./assets/Abilities/Ability_Sticky_Fingers.png", "name": "Sticky Fingers", "tags": ["S", "T", "W", "G", "B", "H"]},
  {"src": "./assets/Abilities/Ability_Summoner.png", "name": "Summoner", "tags": ["S", "W", "G", "B", "R"]},
  {"src": "./assets/Abilities/Ability_Truth_Retrieval.png", "name": "Truth Retrieval", "tags": ["G", "H", "R"]},
  {"src": "./assets/Abilities/Ability_Poison.png", "name": "Poison", "tags": ["S", "P"]},
  {"src": "./assets/Abilities/Ability_Antidote.png", "name": "Antidote", "tags": ["S", "P", "T", "W", "G", "B", "H", "R"]},
  {"src": "./assets/Abilities/Ability_Love_Potion.png", "name": "Love Potion", "tags": ["S", "P", "T", "W", "G", "B", "H", "R"]},
  {"src": "./assets/Abilities/Ability_Truth_Serum.png", "name": "Truth Serum", "tags": ["S", "P", "T", "W", "G", "B", "H", "R"]},
].map(card => ({ ...card, src: card.src + '?v=' + CARD_ASSET_VERSION }));

const TAB_ICONS = [
  { src: './assets/Buttons/Home_Tab.png',     label: 'Home' },
  { src: './assets/Buttons/Table_Tab.png',    label: 'Table' },
  { src: './assets/Buttons/Cards_Tab.png',    label: 'Cards' },
  { src: './assets/Buttons/Rulebook_Tab.png', label: 'Rules' },
];

const RULEBOOK_PDF = './assets/App_Rulebook.pdf?v=5.0';

/* ============================================================
   STATE
   ============================================================ */
const state = {
  activeTab: 1,                                  // 1=home, 2=table, 3=cards, 4=rulebook
  playerNames: Array(8).fill(''),
  // cell values cycle 0 -> 1 (faint X) -> 2 (solid X) -> 3 (check) -> 0
  tableData: Array.from({ length: 8 }, () => Array(8).fill(0)),
  points: 0,
  selectedIcons: [],                             // array of icon keys
  fullscreenCard: null,                          // index into filtered list
  modal: null,                                   // null | 'add' | 'override'
  inputValue: '',
};

/* ============================================================
   PERSISTENCE (per-device, private — no backend)
   Saves only the durable game data, not transient UI state like
   open dialogs or in-progress input. Wrapped in try/catch so the
   app still works if storage is unavailable (e.g. iOS private mode).
   ============================================================ */
const STORAGE_KEY = 'gameCompanion.v2';

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      playerNames: state.playerNames,
      tableData: state.tableData,
      points: state.points,
      selectedIcons: state.selectedIcons,
    }));
  } catch (e) {
    /* storage full or blocked — fail silently, app keeps working in-memory */
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    // Validate shape before trusting it, so a corrupt/old blob can't break startup.
    if (Array.isArray(saved.playerNames) && saved.playerNames.length === 8) {
      state.playerNames = saved.playerNames.map(n => (typeof n === 'string' ? n : ''));
    }
    if (Array.isArray(saved.tableData) && saved.tableData.length === 8
        && saved.tableData.every(row => Array.isArray(row) && row.length === 8)) {
      state.tableData = saved.tableData.map(row => row.map(v => (Number.isInteger(v) && v >= 0 && v <= 4 ? v : 0)));
    }
    if (typeof saved.points === 'number' && saved.points >= 0) {
      state.points = saved.points;
    }
    if (Array.isArray(saved.selectedIcons)) {
      // keep only icon keys we actually recognize
      state.selectedIcons = saved.selectedIcons.filter(k => ICON_KEYS.includes(k));
    }
  } catch (e) {
    /* corrupt data — ignore and start fresh */
  }
}

/* ============================================================
   HELPERS
   ============================================================ */
const $ = sel => document.querySelector(sel);
const el = (tag, props = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) node.setAttribute(k, v);
  }
  for (const c of children) if (c) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  return node;
};
// image that swaps to a fallback element on error
const imgOrFallback = (src, imgClass, fallbackNode) => {
  const wrap = el('span', { style: 'display:contents' });
  const image = el('img', { src, class: imgClass || '', alt: '' });
  image.addEventListener('error', () => { image.remove(); wrap.appendChild(fallbackNode); });
  wrap.appendChild(image);
  return wrap;
};
// Compressed JPG thumbnail path (same basename) for a card's original PNG src.
function thumbSrc(src) {
  const file = src.split('?')[0].split('/').pop().replace(/\.png$/i, '.jpg');
  return './assets/Compressed%20Assets/' + file + '?v=' + CARD_ASSET_VERSION;
}
// Card grid thumbnail: load fast compressed JPG, fall back to original PNG, then text.
function cardThumb(card) {
  const wrap = el('span', { style: 'display:contents' });
  const image = el('img', { src: thumbSrc(card.src), alt: '' });
  let stage = 0;
  image.addEventListener('error', () => {
    if (stage === 0) { stage = 1; image.src = card.src; }
    else { image.remove(); wrap.appendChild(el('div', { class: 'card-fallback', text: card.name })); }
  });
  wrap.appendChild(image);
  return wrap;
}

/* ============================================================
   RENDER: TAB 1 — TABLE + POINT TRACKER
   ============================================================ */
function renderTable() {
  const wrap = el('div', { class: 'tab1-wrap' });

  const table = el('div', { class: 'table' });

  // header row
  const header = el('div', { class: 'trow' });
  header.appendChild(el('div', { class: 'theader', text: 'Player Name' }));
  ICONS.forEach(ic => {
    const cell = el('div', { class: 'cell icon-cell' });
    cell.appendChild(imgOrFallback(ic.icon, 'ticon', el('div', { class: 'ticon-fallback', text: ic.key })));
    header.appendChild(cell);
  });
  table.appendChild(header);

  // player rows
  state.playerNames.forEach((name, r) => {
    const row = el('div', { class: 'trow' });
    const saveName = e => {
      if (e.isComposing) return;
      const input = e.target;
      // Mobile keyboards may keep lowercase after Return focuses the next row.
      const value = input.value.replace(/^(\s*)(\p{L})/u,
        (_, space, letter) => space + letter.toLocaleUpperCase());
      if (value !== input.value) {
        const start = input.selectionStart, end = input.selectionEnd;
        const delta = value.length - input.value.length;
        input.value = value;
        input.setSelectionRange(start + delta, end + delta);
      }
      state.playerNames[r] = input.value;
      saveState();
    };
    const nameInput = el('input', {
      class: 'name-input',
      autocapitalize: 'sentences',
      placeholder: `Player ${r + 1}`,
      value: name,
      oninput: saveName,
      oncompositionend: saveName,
    });
    // Enter key advances focus to the next player-name field.
    nameInput.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || e.isComposing) return;
      e.preventDefault();
      const inputs = Array.from(document.querySelectorAll('.name-input'));
      const idx = inputs.indexOf(e.target);
      if (idx > -1 && idx < inputs.length - 1) inputs[idx + 1].focus();
      else e.target.blur();
    });
    row.appendChild(nameInput);
    ICONS.forEach((_, c) => {
      const v = state.tableData[r][c];
      // states: 0 blank | 1 X (transparent) | 2 X (red bg) | 3 ✓ (transparent) | 4 ✓ (green bg)
      const cls = 'cell' + (v === 2 ? ' x-red' : '') + (v === 4 ? ' checked' : '') + (r === 3 && c === 3 ? ' tutorial-center-cell' : '');
      const cell = el('div', { class: cls }); cell.dataset.row = String(r); cell.dataset.col = String(c);
      const t = el('span', { class: 'cell-text' });
      if (v === 1 || v === 2) t.textContent = 'X';
      else if (v === 3 || v === 4) t.textContent = '✓';
      cell.appendChild(t);
      cell.addEventListener('click', () => {
        const tutorialCellTap = tutorial.active && TUTORIAL_STEPS[tutorial.index]?.action === 'cell' && r === 3 && c === 3;
        state.tableData[r][c] = (state.tableData[r][c] + 1) % 5;
        if (tutorialCellTap) tutorial.index++;
        requestAnimationFrame(() => jiggleButton(document.querySelector('.cell[data-row="' + r + '"][data-col="' + c + '"]')));
        render();
        if (tutorialCellTap) showTutorialStep();
      });
      row.appendChild(cell);
    });
    table.appendChild(row);
  });

  wrap.appendChild(table);

  // point tracker
  const box = el('div', { class: 'point-box' });
  box.appendChild(el('div', { class: 'point-label', text: 'Point Total' }));
  box.appendChild(el('button', { class: 'point-value', text: String(state.points), onclick: () => { openOverride(); if (tutorial.active && TUTORIAL_STEPS[tutorial.index]?.action === 'tap-override') { tutorial.overrideOpened = true; requestAnimationFrame(positionTutorialOverlay); } } }));
  box.appendChild(el('button', { class: 'add-btn', text: '+', onclick: () => { openAddPoints(); if (tutorial.active && TUTORIAL_STEPS[tutorial.index]?.action === 'tap-add') { state.inputValue = '12'; render(); tutorial.index++; showTutorialStep(); } } }));
  wrap.appendChild(box);

  return wrap;
}

const TUTORIAL_STEPS = [
  { tab: 1, section: 'Home', text: 'Welcome to Frog Pond Companion!', center: true },

/* The rulebook is rendered page-by-page with pdf.js into a scrollable column.
   This is necessary because iOS Safari only shows the first page of a PDF in an
   <iframe>/<embed>. pdf.js is loaded lazily from a CDN (the one external
   dependency, added deliberately to make the in-page preview scrollable).
   Rendered pages are cached so re-visiting the tab is instant. */
let rulebookPagesHTML = null;   // cached <img> markup of rendered pages
let rulebookRendering = false;

function ensurePdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      resolve(window.pdfjsLib);
    };
    s.onerror = () => reject(new Error('pdf.js failed to load'));
    document.head.appendChild(s);
  });
}

async function loadRulebook(container) {
  if (rulebookRendering) return;
  rulebookRendering = true;
  try {
    const pdfjsLib = await ensurePdfJs();
    const pdf = await pdfjsLib.getDocument(RULEBOOK_PDF).promise;
    const targetW = Math.min((container.clientWidth || 800) - 20, 1000);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const imgs = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const base = page.getViewport({ scale: 1 });
      const viewport = page.getViewport({ scale: (targetW / base.width) * dpr });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width; canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      imgs.push('<img class="pdf-page" alt="Page ' + p + '" src="' + canvas.toDataURL('image/jpeg', 0.85) + '" />');
    }
    rulebookPagesHTML = imgs.join('');
    const live = document.getElementById('pdf-pages');
    if (live) live.innerHTML = rulebookPagesHTML;
  } catch (e) {
    const live = document.getElementById('pdf-pages');
    if (live) live.innerHTML = '<div class="pdf-loading">Preview unavailable — use the “Open Rulebook PDF” button above.</div>';
  } finally {
    rulebookRendering = false;
  }
}

function renderRulebook() {
  const wrap = el('div', { class: 'rulebook-wrap' });
  // Button is the first thing visible; the scrollable page preview sits below it.
  wrap.appendChild(el('a', { class: 'pdf-open-btn', href: RULEBOOK_PDF, target: '_blank', text: 'Open Rulebook PDF' }));
  const pages = el('div', { class: 'pdf-pages', id: 'pdf-pages' });
  if (rulebookPagesHTML) {
    pages.innerHTML = rulebookPagesHTML;            // cached — instant
  } else {
    pages.appendChild(el('div', { class: 'pdf-loading', text: 'Loading rulebook…' }));
    setTimeout(() => loadRulebook(pages), 0);       // render after it's in the DOM (needs clientWidth)
  }
  wrap.appendChild(pages);
  return wrap;
}

  if (iosInstallSwipeController) iosInstallSwipeController.abort();

  const swipeOptions = { signal: iosInstallSwipeController.signal };
  box.style.transform = ''; box.style.transition = '';
  let dragStartY = null;
  let dragStartTime = 0;
  let activePointerId = null;
  let dragging = false;
  const finishSheetDrag = event => {
    if (activePointerId !== event.pointerId || dragStartY === null) return;
    const distance = Math.max(0, event.clientY - dragStartY);
    const velocity = distance / Math.max(1, performance.now() - dragStartTime);
    activePointerId = null;
    dragStartY = null;
    box.style.transition = 'transform .22s ease';
    if (dragging && (distance > 90 || (distance > 35 && velocity > .5))) {
      box.style.transform = 'translateY(100%)';
      setTimeout(closeDialog, 220);
    } else {
      box.style.transform = '';
    }
    dragging = false;
  };
  const startSheetDrag = event => {
    if (event.button !== undefined && event.button !== 0) return;
    activePointerId = event.pointerId;
    dragStartY = event.clientY;
    dragStartTime = performance.now();
    dragging = false;
    box.style.transition = 'none';
    if (event.target.setPointerCapture) {
      try { event.target.setPointerCapture(event.pointerId); } catch (_) {}
    }
  };
  const moveSheetDrag = event => {
    if (activePointerId !== event.pointerId || dragStartY === null) return;
    const offset = event.clientY - dragStartY;
    if (offset < 0) return;
    if (offset > 6) {
      dragging = true;
      event.preventDefault();
      box.style.transform = 'translateY(' + offset + 'px)';
    }
  };
  overlay.addEventListener('pointerdown', startSheetDrag, swipeOptions);
  overlay.addEventListener('pointermove', moveSheetDrag, swipeOptions);
  overlay.addEventListener('pointerup', finishSheetDrag, swipeOptions);
  overlay.addEventListener('pointercancel', finishSheetDrag, swipeOptions);
  overlay.hidden = false;
}

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', event => {
  event.preventDefault();
  deferredInstallPrompt = event;
});

async function handleInstallApp() {
  if (deferredInstallPrompt) {
    const promptEvent = deferredInstallPrompt;
    deferredInstallPrompt = null;
    await promptEvent.prompt();
    await promptEvent.userChoice;
    return;
  }

  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (standalone) {
    showNotice('App installed', 'Scorpion in the Frog Pond is already available from your Home Screen.');
  } else if (ios) {
    const safari = /Safari/i.test(navigator.userAgent) && !/CriOS|FxiOS|EdgiOS|OPiOS/i.test(navigator.userAgent);
        showIOSInstallPopup(safari);
  } else {
    showNotice('Install app', 'Open your browser menu and choose Install app or Add to Home Screen.');
  }
}

function handleAddPoints() {
  const added = parseInt(state.inputValue || '0', 10);
  if (isNaN(added)) { showNotice('Invalid input', 'Please enter a number.'); return; }
  const total = state.points + added;
  const cardsToDraw = Math.floor(total / 10);
  state.points = total % 10;
  state.modal = null; state.inputValue = '';
  render();
  if (cardsToDraw > 0) showNotice('Ancient Ability Learned!', `Draw ${cardsToDraw} Ancient Ability card${cardsToDraw > 1 ? 's' : ''}`);
  if (tutorial.active && TUTORIAL_STEPS[tutorial.index]?.action === 'tap-confirm') {
    tutorial.index++;
    tutorial.waitingForNotice = cardsToDraw > 0;
    showTutorialStep();
  }
}

function transitionFullscreenCard(direction) {
  if (fsAnimating || state.fullscreenCard === null) return;
  const cards = getFilteredImages();
  if (cards.length < 2) return;
  fsAnimating = true;
  const width = $('#fs-content').clientWidth || window.innerWidth;
  const current = state.fullscreenCard;
  const target = (current + direction + cards.length) % cards.length;
  const before = (current - 1 + cards.length) % cards.length;
  const after = (current + 1) % cards.length;
  const track = buildFullscreenTrack([cards[before], cards[current], cards[after]], width);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    track.classList.add('is-animating');
    track.style.transform = 'translate3d(' + (direction > 0 ? -2 * width : 0) + 'px, 0, 0)';
  }));

}

function buildFullscreenTrack(cards, width) {

function animateTabChange(nextTab) {
  if (tutorial.active && !tutorial.allowTabSwitch) return;
  if (nextTab === state.activeTab) return;

  const app = document.querySelector('.app');
  app.querySelectorAll('.tab-transition-layer').forEach(layer => layer.remove());
  const content = $('#content');
  content.style.clipPath = '';
  const oldTab = state.activeTab;
  const direction = nextTab > oldTab ? -1 : 1;
  const transition = document.createElement('div');
  transition.className = 'tab-transition-layer';
  transition.setAttribute('aria-hidden', 'true');
  app.insertBefore(transition, content);
  const outgoing = document.createElement('div');
  outgoing.className = 'tab-transition-page';
  const oldPage = content;
  oldPage.removeAttribute('id');
  outgoing.appendChild(oldPage);
  const nextPage = document.createElement('div');
  nextPage.id = 'content';
  nextPage.className = 'content';
  app.insertBefore(nextPage, transition);
  const oldReset = $('#reset-btn').cloneNode(true);
  oldReset.removeAttribute('id');
  oldReset.setAttribute('aria-hidden', 'true');
  outgoing.appendChild(oldReset);
  transition.appendChild(outgoing);

  state.activeTab = nextTab;
  render();
  const incoming = $('#content');
  const incomingParts = Array.from(incoming.children);
  incoming.scrollTop = 0;

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    transition.remove();
    return;
  }

  const duration = 500;
  const start = performance.now();
  const paint = now => {
    if (!transition.isConnected) return;
    const progress = Math.min(1, (now - start) / duration);
    const eased = progress * progress;
    const width = transition.clientWidth || window.innerWidth;
    const height = transition.clientHeight || window.innerHeight;
    const edge = direction < 0 ? width * (1 - eased) : width * eased;
    const wobble = Math.sin(Math.PI * eased);
    const edgePoints = [];
    const count = 64;
    for (let i = 0; i <= count; i++) {
      const y = i / count;
      const broad = Math.sin(y * Math.PI * 2.1 + 0.35) * width * 0.035;
      const fine = Math.sin(y * Math.PI * 6.2 - 0.7) * width * 0.018;
      const drops = (
        Math.exp(-Math.pow((y - 0.2) / 0.08, 2)) * 0.12 +
        Math.exp(-Math.pow((y - 0.53) / 0.13, 2)) * 0.2 +
        Math.exp(-Math.pow((y - 0.82) / 0.09, 2)) * 0.13
      ) * width;
      const undulation = (broad + fine + drops) * wobble;
      const x = Math.max(0, Math.min(width, edge - direction * undulation));
      edgePoints.push([x / width * 100, y * 100]);
    }

    const edgePath = edgePoints.map(([x, y]) => x + '% ' + y + '%').join(', ');
    const leftPolygon = '0% 0%, ' + edgePath + ', 0% 100%';
    const rightPolygon = edgePoints[0][0] + '% 0%, 100% 0%, 100% 100%, ' +
      edgePoints.slice().reverse().map(([x, y]) => x + '% ' + y + '%').join(', ');
    transition.style.clipPath = 'polygon(' + (direction < 0 ? leftPolygon : rightPolygon) + ')';
    incoming.style.clipPath = 'polygon(' + (direction < 0 ? rightPolygon : leftPolygon) + ')';
    outgoing.style.transform = 'translateX(' + (direction * eased * 14) + 'vw) scale(' + (1 - eased * 0.035) + ')';
    const incomingOffset = -direction * (1 - eased) * 14;
    incomingParts.forEach(part => {
      part.style.willChange = 'transform';
      part.style.transform = 'translateX(' + incomingOffset + 'vw) scale(' + (0.95 + eased * 0.05) + ')';
    });

    if (progress < 1) requestAnimationFrame(paint);
    else {
      transition.remove();
      incoming.style.clipPath = '';
      incomingParts.forEach(part => {
        part.style.transform = '';
        part.style.willChange = '';
      });
    }
  };
  requestAnimationFrame(paint);
}

function enterTutorialStep(step) {

    const content=$('#content');
    if (tutorial.scrollRaf) cancelAnimationFrame(tutorial.scrollRaf);
    const start=content.scrollTop, end=Math.max(0,content.scrollHeight-content.clientHeight), began=performance.now(), duration=2400;
    const scroll=now=>{
      if (!tutorial.active || TUTORIAL_STEPS[tutorial.index]!==step) return;
      const p=Math.min(1,(now-began)/duration), eased=p*p;
      content.scrollTop=start+(end-start)*eased; positionTutorialOverlay();
      if(p<1) tutorial.scrollRaf=requestAnimationFrame(scroll); else tutorial.scrollRaf=0;
    };

  tutorial.overrideOpened=false;
  render();
  if(i===15)showNotice('Ancient Ability Learned!','Draw 1 Ancient Ability card');
  showTutorialStep();
}
document.addEventListener('click', event => {
  if(!tutorial.active)return;
  const target=event.target instanceof Element?event.target:null;
  if(!target||target.closest('#tutorial-card, #tutorial-exit'))return;
  const step=TUTORIAL_STEPS[tutorial.index];let allowed=false;
  if(step?.action==='cell')allowed=!!target.closest('.tutorial-center-cell');
  if(step?.action==='tap-add')allowed=!!target.closest('.add-btn');
  if(step?.action==='tap-confirm')allowed=!!target.closest('#points-modal .modal-confirm');
  if(step?.action==='tap-notice-ok')allowed=!!target.closest('#dialog-box .modal-confirm');
  if(step?.action==='tap-override') {
    const zero=target.closest('#points-modal .num-btn');
    allowed=tutorial.overrideOpened ? !!(zero&&zero.textContent.trim()==='0') : !!target.closest('.point-value');
  }
  if(step?.action==='poison-filter')allowed=!!target.closest('.filter-icon[data-icon-filter="P"]');
  if(step?.action==='tree-filter')allowed=!!target.closest('.filter-icon[data-icon-filter="T"]');
  if(step?.action==='open-diversion')allowed=!!target.closest('.tutorial-diversion-card');
  if(step?.action==='card-fullscreen')allowed=!!target.closest('#fs-close, #fs-modal .fs-nav');
  if(allowed)return;
  event.preventDefault();event.stopImmediatePropagation();
},true);


$('#tutorial-next').addEventListener('click', nextTutorialStep);
$('#tutorial-back').addEventListener('click', backTutorialStep);
$('#tutorial-exit').addEventListener('click', exitTutorial);
$('#content').addEventListener('scroll', () => { if (tutorial.active) positionTutorialOverlay(); }, { passive: true });
function refreshTutorialLayout() {
  if (!tutorial.active) return;
  const step=TUTORIAL_STEPS[tutorial.index];
  requestAnimationFrame(() => {
    if (!tutorial.active || TUTORIAL_STEPS[tutorial.index]!==step) return;
    if (step.action==='open-diversion') {
      const content=$('#content'), diversion=$('.tutorial-diversion-card');
      if (content && diversion) {
        const contentBox=content.getBoundingClientRect(), cardBox=diversion.getBoundingClientRect();
        const visibleCenterY=contentBox.top+content.clientTop+content.clientHeight/2;
        content.scrollTop += cardBox.top+cardBox.height/2-visibleCenterY;
      }
    }
    positionTutorialOverlay();
  });
}
window.addEventListener('resize', refreshTutorialLayout, { passive: true });
window.addEventListener('orientationchange', refreshTutorialLayout, { passive: true });

function renderTabBar() {
  const bar = $('#tab-bar');
  bar.innerHTML = '';
  TAB_ICONS.forEach((t, i) => {
    const active = state.activeTab === i + 1;
    const btn = el('button', {
      class: 'tab-button',
      'aria-label': t.label,
      title: t.label,
      onclick: () => animateTabChange(i + 1),
    });
    btn.dataset.tabIndex = String(i);
    btn.appendChild(imgOrFallback(t.src, '', el('div', { class: 'tab-fallback', text: t.label })));
    bar.appendChild(btn); if (active) { btn.classList.remove('active'); const icon = btn.querySelector('img'); if (icon && icon.decode) icon.decode().then(() => { if (btn.isConnected) btn.classList.add('active'); }, () => { if (btn.isConnected) btn.classList.add('active'); }); else btn.classList.add('active'); }
  });
}

function render() {
  const content = $('#content');
  content.className = 'content tab-' + state.activeTab;  // enables per-tab layout (e.g. centering tab 1)
  content.innerHTML = '';
  if (state.activeTab === 1) content.appendChild(renderLanding());
  else if (state.activeTab === 2) content.appendChild(renderTable());
  else if (state.activeTab === 3) content.appendChild(renderCards());
  else if (state.activeTab === 4) content.appendChild(renderRulebook());

  // Reset button belongs to the table tab.
  $('#reset-btn').style.display = state.activeTab === 2 ? 'flex' : 'none';

  renderTabBar();
  renderPointsModal();
  renderFullscreen();

  // Persist durable game data after every state-changing render.
  if (!tutorial.active) saveState();
  if (tutorial.active) requestAnimationFrame(positionTutorialOverlay);
}

/* ============================================================
   GLOBAL EVENTS
   ============================================================ */
$('#reset-btn').addEventListener('click', () => {
  if (tutorial.active) return;
  showConfirm('Reset Game?', 'Are you sure you want to start a new game?', () => {
    state.playerNames = Array(8).fill('');
    state.tableData = Array.from({ length: 8 }, () => Array(8).fill(0));
    state.points = 0;
    render();
  });
});

$('#points-modal').addEventListener('click', e => { if (e.target.id === 'points-modal') closeModal(); });
$('#dialog-modal').addEventListener('click', e => { if (e.target.id === 'dialog-modal') closeDialog(); });
$('#fs-close').addEventListener('click', () => { state.fullscreenCard = null; render(); });
$('#fs-modal').addEventListener('click', e => { if (e.target.id === 'fs-modal') { state.fullscreenCard = null; render(); } });

// Fullscreen card navigation: arrows and keyboard animate between cards; dragging tracks the pointer.
document.addEventListener('keydown', e => {
  if (state.fullscreenCard === null) return;
  if (e.key === 'ArrowRight') transitionFullscreenCard(1);
  else if (e.key === 'ArrowLeft') transitionFullscreenCard(-1);
  else if (e.key === 'Escape') { state.fullscreenCard = null; render(); }
});const fsContent = $('#fs-content'); let fsClickWasOnCard = false;

  
fsContent.addEventListener('pointerdown', e => {
  if (state.fullscreenCard === null || fsAnimating || e.button !== 0) return; const target = e.target instanceof Element ? e.target : null; fsClickWasOnCard = !!(target && target.closest('.fs-card-slide img, .fs-card-slide .card-fallback'));
  const cards = getFilteredImages();
  if (cards.length < 2) { fsPointer = { id: e.pointerId, startX: e.clientX, startY: e.clientY, width: fsContent.clientWidth || window.innerWidth, track: null, dragging: false, dismissOnRelease: !fsClickWasOnCard }; fsContent.setPointerCapture(e.pointerId); return; }
  const width = fsContent.clientWidth || window.innerWidth;
  const current = state.fullscreenCard;
  const before = (current - 1 + cards.length) % cards.length;
  const after = (current + 1) % cards.length;
  const track = buildFullscreenTrack([cards[before], cards[current], cards[after]], width);
  fsPointer = { id: e.pointerId, startX: e.clientX, startY: e.clientY, width, track, dragging: false, dismissOnRelease: !fsClickWasOnCard };
  fsContent.setPointerCapture(e.pointerId);
});
fsContent.addEventListener('pointermove', e => {
  if (!fsPointer || e.pointerId !== fsPointer.id) return;
  const dx = e.clientX - fsPointer.startX;
  const dy = e.clientY - fsPointer.startY;
  if (!fsPointer.dragging) {
    if (Math.abs(dy) >= 8 && Math.abs(dy) > Math.abs(dx)) { fsPointer.vertical = true; } else if (Math.abs(dx) < 5 || Math.abs(dx) <= Math.abs(dy)) return;
    fsPointer.dragging = true;
  }
  e.preventDefault();
  if (fsPointer.track && !fsPointer.vertical) fsPointer.track.style.transform = 'translate3d(' + (-fsPointer.width + dx) + 'px, 0, 0)';
});

function finishFullscreenPointer(e) {
  if (!fsPointer || e.pointerId !== fsPointer.id) return;
  const gesture = fsPointer;
  fsPointer = null;
  if (gesture.vertical) { const dy = e.clientY - gesture.startY; if (Math.abs(dy) >= 48) { state.fullscreenCard = null; render(); } else renderFullscreen(); return; } if (!gesture.dragging) { if (gesture.dismissOnRelease) { state.fullscreenCard = null; render(); } return; }
  const dx = e.clientX - gesture.startX;
  const threshold = Math.max(44, gesture.width * 0.18);
  const direction = dx <= -threshold ? 1 : dx >= threshold ? -1 : 0;
  fsAnimating = true;
  gesture.track.classList.add('is-animating');
  gesture.track.style.transform = 'translate3d(' + (direction > 0 ? -2 * gesture.width : direction < 0 ? 0 : -gesture.width) + 'px, 0, 0)';
  gesture.track.addEventListener('transitionend', () => {
    if (direction) {
      const total = getFilteredImages().length;
      state.fullscreenCard = (state.fullscreenCard + direction + total) % total;
    }
    fsAnimating = false;
    renderFullscreen();
  }, { once: true });
}
fsContent.addEventListener('pointerup', finishFullscreenPointer);fsContent.addEventListener('pointercancel', finishFullscreenPointer); fsContent.addEventListener('click', e => { const onCard = fsClickWasOnCard; fsClickWasOnCard = false; if (onCard) return; state.fullscreenCard = null; render(); });
// Tab ribbon: a vertical swipe ANYWHERE on screen toggles it (down = hide, up =
// reveal). Only the ribbon moves — the display never scrolls (locked above).
// Horizontal swipes navigate adjacent tabs unless a modal or control owns the gesture.
const tabBarEl = $('#tab-bar');
let swipeStartX = null, swipeStartY = null;
document.addEventListener('touchstart', e => {
  swipeStartX = e.touches[0].clientX; swipeStartY = e.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (swipeStartY === null) return;
  const dx = e.changedTouches[0].clientX - swipeStartX;
  const dy = e.changedTouches[0].clientY - swipeStartY;
  swipeStartX = swipeStartY = null; if (!$('#dialog-modal').hidden || !$('#points-modal').hidden) return; if (state.fullscreenCard !== null && Math.abs(dy) >= 60 && Math.abs(dy) > Math.abs(dx)) { state.fullscreenCard = null; render(); return; }
if (Math.abs(dx) >= 48 && Math.abs(dx) > Math.abs(dy)) { const overlaysOpen = !$('#fs-modal').hidden || !$('#dialog-modal').hidden || !$('#points-modal').hidden; const onControl = e.target instanceof Element && e.target.closest('button, a, input, textarea, select, [contenteditable="true"]'); const nextTab = state.activeTab + (dx < 0 ? 1 : -1); if (!overlaysOpen && !onControl && nextTab >= 1 && nextTab <= TAB_ICONS.length) animateTabChange(nextTab); return; } if (Math.abs(dy) < 40 || Math.abs(dy) <= Math.abs(dx)) return;
  tabBarEl.classList.toggle('hidden', dy > 0);                    // down hides, up reveals
}, { passive: true });

loadState();
render();

// Asset load ordering:
//  1) the browser loads the immediate page assets (icons, buttons, video) — we
//     wait for window 'load' so those finish first;
//  2) then we warm the compressed card thumbnails (the next thing a user sees);
//  3) only once those are done do we pull the heavy full-res originals in the
//     background, so they never compete with anything the user is waiting on.
function preloadAll(urls) {
  return Promise.all(urls.map(u => new Promise(res => {
    const img = new Image();
    img.onload = img.onerror = res;
    img.src = u;
  })));
}
window.addEventListener('load', () => {
  const compressed = ABILITY_IMAGES.map(card => thumbSrc(card.src));
  preloadAll(compressed).then(() => {
    // high-res, fire-and-forget in the background
    ABILITY_IMAGES.forEach(card => { const img = new Image(); img.src = card.src; });
  });
});
</script>
